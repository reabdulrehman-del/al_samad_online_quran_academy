<!-- ========================================== -->
<!-- PROPER ADMIN LOGIN & DASHBOARD SYSTEM      -->
<!-- ========================================== -->
<div id="adminSection" class="max-w-7xl mx-auto px-4 py-8 bg-slate-900 text-white border-t border-antiqueGold/30 mt-10">
    <div class="max-w-md mx-auto bg-slate-800 p-6 rounded-2xl border border-antiqueGold/50 shadow-xl">
        <h3 class="text-xl font-bold text-antiqueGold mb-4 text-center"><i class="fa-solid fa-lock mr-2"></i> Admin Portal Login</h3>
        <div id="loginFormContainer" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Admin Username</label>
                <input type="text" id="adminUserField" placeholder="Enter username" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white text-sm focus:outline-none focus:border-antiqueGold">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Admin Password</label>
                <input type="password" id="adminPassField" placeholder="Enter password" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white text-sm focus:outline-none focus:border-antiqueGold">
            </div>
            <button onclick="processAdminLogin()" class="w-full py-3 bg-antiqueGold hover:bg-amber-500 text-slate-900 font-bold rounded-xl transition-all shadow-md text-sm">
                Login to Dashboard
            </button>
        </div>

        <!-- Dashboard Panel (Initially Hidden until login) -->
        <div id="dashboardPanelContainer" class="hidden space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700">
                <span class="text-emerald-400 font-bold text-sm"><i class="fa-solid fa-circle-check mr-1"></i> Logged In Successfully</span>
                <button onclick="processAdminLogout()" class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold">Logout</button>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Teem App Chat Link / Number</label>
                <input type="text" id="dbTeemInput" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Official Mobile Number</label>
                <input type="text" id="dbPhoneInput" class="w-full p-3 rounded-xl bg-slate-700 border border-slate-600 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Upload Image / Experience Proof (No-Code)</label>
                <input type="file" id="dbImageUploader" accept="image/*" class="w-full p-2 rounded-xl bg-slate-700 border border-slate-600 text-xs text-slate-300">
            </div>
            <button onclick="saveDashboardChanges()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-all shadow-md text-sm">
                Save Changes & Update Website
            </button>
        </div>
    </div>
</div>

<script>
    const CORRECT_USER = "alsamad_admin";
    const CORRECT_PASS = "quran_admin_2026";

    // Page Load پر چیک کریں کہ آیا پہلے سے لاگ ان ہے یا نہیں
    document.addEventListener("DOMContentLoaded", () => {
        let isLoggedIn = localStorage.getItem("isAdminLoggedIn") === "true";
        if (isLoggedIn) {
            showDashboardView();
        }
        
        // اگر لوکل اسسٹوری میں Teem لنک محفوظ ہے تو اسے ویب سائٹ پر اپڈیٹ کر دیں
        let savedTeem = localStorage.getItem("adminTeemLink");
        if(savedTeem) {
            document.querySelectorAll('a[href*="teem.pk"], a[href*="wa.me"]').forEach(el => {
                el.href = savedTeem;
            });
        }
    });

    function processAdminLogin() {
        let u = document.getElementById("adminUserField").value.trim();
        let p = document.getElementById("adminPassField").value.trim();

        if (u === CORRECT_USER && p === CORRECT_PASS) {
            localStorage.setItem("isAdminLoggedIn", "true");
            alert("Login Successful!");
            showDashboardView();
        } else {
            alert("Incorrect Username or Password!");
        }
    }

    function processAdminLogout() {
        localStorage.setItem("isAdminLoggedIn", "false");
        document.getElementById("loginFormContainer").classList.remove("hidden");
        document.getElementById("dashboardPanelContainer").classList.add("hidden");
        document.getElementById("adminUserField").value = "";
        document.getElementById("adminPassField").value = "";
        alert("Logged out successfully.");
    }

    function showDashboardView() {
        document.getElementById("loginFormContainer").classList.add("hidden");
        document.getElementById("dashboardPanelContainer").classList.remove("hidden");
        
        // پرانی ویلیوز خانوں میں لوڈ کریں
        document.getElementById("dbTeemInput").value = localStorage.getItem("adminTeemLink") || "https://teem.pk/your-link";
        document.getElementById("dbPhoneInput").value = localStorage.getItem("adminPhone") || "+923032549945";
    }

    function saveDashboardChanges() {
        let tVal = document.getElementById("dbTeemInput").value;
        let pVal = document.getElementById("dbPhoneInput").value;
        localStorage.setItem("adminTeemLink", tVal);
        localStorage.setItem("adminPhone", pVal);

        let fileInput = document.getElementById("dbImageUploader");
        if (fileInput.files && fileInput.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem("customUploadedImage", e.target.result);
                alert("Settings and Image saved successfully!");
                location.reload();
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            alert("Settings saved successfully!");
            location.reload();
        }
    }
    </script>
